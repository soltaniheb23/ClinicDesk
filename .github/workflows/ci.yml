name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The name is a required status check in the protect-main ruleset. Renaming it blocks every PR.
  server:
    name: Server (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails the job if coverage drops below the threshold in server/package.json.
      # shell: bash adds pipefail, so a failing test or threshold still fails the step.
      - name: Test with coverage
        shell: bash
        run: npm run test:coverage | tee coverage-output.txt

      # Show the text-summary table on the workflow run page, even when tests fail.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '## Server coverage'
            echo
            echo '```'
            grep -E '^(Statements|Branches|Functions|Lines) +:' coverage-output.txt \
              || echo 'No coverage summary (the test run did not finish).'
            echo '```'
            echo
            echo 'Threshold: 80% for each (server/package.json). Full report: the server-coverage artifact (open lcov-report/index.html).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14
          if-no-files-found: warn

  client:
    name: Client (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
