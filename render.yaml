services:
  - type: web
    name: clinicdesk-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      # Render serves the API through Cloudflare: rate limits key on CF-Connecting-IP.
      # TRUST_PROXY stays unset (1 in production).
      - key: TRUST_CF_CONNECTING_IP
        value: "true"
      # Email notifications (CD-21, docs/notifications.md). With EMAIL_ENABLED=true the API
      # refuses to start until every SMTP_* value, MAIL_FROM and APP_URL is set. The SMTP
      # values are set in the Render dashboard only (sync: false), never in this file.
      - key: EMAIL_ENABLED
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        value: https://clinic-desk-sable.vercel.app
