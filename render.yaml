services:
  - type: web
    name: clinicdesk-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      # Render serves the API through Cloudflare: rate limits key on CF-Connecting-IP.
      # TRUST_PROXY stays unset (1 in production).
      - key: TRUST_CF_CONNECTING_IP
        value: "true"
      # Temporary: "true" logs the client-IP inputs of each failed login.
      - key: DEBUG_CLIENT_IP
        value: "false"
