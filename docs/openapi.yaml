openapi: 3.0.3
info:
  title: ClinicDesk API
  version: 1.0.0
  description: >
    Helpdesk API for a clinic. Draft contract for ticket CD-5. Endpoints need a
    bearer token unless they set `security: []`; role rules are in
    docs/roles-and-permissions.md.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Tickets
  - name: Comments
  - name: Attachments
  - name: Users
  - name: Admin

paths:
  /health:
    servers:
      - url: http://localhost:3000
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              example: { status: ok }

  /hello:
    get:
      summary: Staging connectivity check
      security: []
      responses:
        '200':
          description: API greeting for the deployed frontend
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
              example: { message: Hello from ClinicDesk API }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer
      description: >
        Creates a customer account and returns the user with an access token.
        Any `role` sent by the client is ignored; new accounts are always `customer`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example: { name: Mara Jensen, email: mara@example.com, password: a-long-password }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
                token: '<jwt>'
        '400':
          description: Validation error (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details: [ { field: password, message: Password must be at least 8 characters } ]
        '409':
          description: Email already used (EMAIL_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: EMAIL_TAKEN, message: An account with this email already exists }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: >
        Returns an access token. Wrong password, unknown email and deactivated
        accounts all return the same 401 response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: { email: mara@example.com, password: a-long-password }
      responses:
        '200':
          description: Token and user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                token: '<jwt>'
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
        '400':
          description: Missing or malformed fields (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details: [ { field: password, message: Password is required } ]
        '401':
          description: Wrong email or password, or deactivated account (INVALID_CREDENTIALS, always the same message)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: INVALID_CREDENTIALS, message: Invalid email or password }
        '429':
          description: Too many login attempts

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: >
        Returns the user behind the bearer token. The role and active flag are read
        from the database, so a role change or deactivation applies immediately.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets, newest first (customers see only their own)
      description: >
        Customers get the tickets they created; agents and admins get all tickets.
        Sorted by `createdAt` descending with `_id` as tie-breaker. A page past the end
        returns an empty `items` array. Filters (status, priority, category, assignee,
        title search) come in CD-17.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: One page of tickets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
              example:
                items:
                  - id: 6651b2a7c3d4e5f6a7b8c9d1
                    title: Printer in reception not working
                    description: It shows error E-12 since this morning.
                    category: it
                    priority: high
                    status: open
                    createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                    assignee: null
                    firstResponseAt: null
                    resolvedAt: null
                    createdAt: '2026-12-01T09:15:00.000Z'
                    updatedAt: '2026-12-01T09:15:00.000Z'
                page: 1
                limit: 10
                total: 1
                totalPages: 1
        '400':
          description: Invalid page or limit (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details: [ { field: limit, message: Limit must be a whole number from 1 to 50 } ]
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tickets]
      summary: Create a ticket (customer, agent, admin)
      description: >
        `createdBy` is the logged-in user. Unknown keys such as `status`, `createdBy`
        and `assignee` are ignored; new tickets are always `open` and unassigned.
        `category` defaults to `other` and `priority` to `normal`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreate' }
            example:
              title: Printer in reception not working
              description: It shows error E-12 since this morning.
              category: it
              priority: high
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: '#/components/schemas/Ticket' }
              example:
                ticket:
                  id: 6651b2a7c3d4e5f6a7b8c9d1
                  title: Printer in reception not working
                  description: It shows error E-12 since this morning.
                  category: it
                  priority: high
                  status: open
                  createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                  assignee: null
                  firstResponseAt: null
                  resolvedAt: null
                  createdAt: '2026-12-01T09:15:00.000Z'
                  updatedAt: '2026-12-01T09:15:00.000Z'
        '400':
          description: Validation error (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details:
                    - { field: title, message: Title must be at most 120 characters }
                    - { field: category, message: Choose a valid category }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Request body larger than 32 KB (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Ticket detail (owner, agent, admin)
      description: >
        An invalid id, an unknown ticket and another customer's ticket all return the
        same 404, so the response never reveals whether a ticket exists.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: The ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: '#/components/schemas/TicketDetail' }
              example:
                ticket:
                  id: 6651b2a7c3d4e5f6a7b8c9d1
                  title: Printer in reception not working
                  description: It shows error E-12 since this morning.
                  category: it
                  priority: high
                  status: in_progress
                  createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                  assignee: { id: 6650c3a1b2c3d4e5f6a7b8c9, name: Lena Berg }
                  firstResponseAt: '2026-12-01T09:40:00.000Z'
                  resolvedAt: null
                  createdAt: '2026-12-01T09:15:00.000Z'
                  updatedAt: '2026-12-01T09:40:00.000Z'
                  allowedNextStatuses: [waiting, resolved]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Ticket not found, not visible to this user, or invalid id (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: NOT_FOUND, message: Ticket not found }

  /tickets/{id}/status:
    patch:
      tags: [Tickets]
      summary: Change status (agent, admin; customer may close own resolved ticket)
      description: >
        Follows docs/status-workflow.md. Allowed: open → in_progress;
        in_progress → waiting, resolved; waiting → in_progress, resolved;
        resolved → closed, in_progress (reopen); closed is final. Agents and admins may
        make any allowed change on any ticket; a customer may only change their own
        resolved ticket to closed.


        Checks run in this order: 404 (invalid id, unknown ticket, or another
        customer's ticket; same body as GET /tickets/{id}) → 400 (invalid body) →
        403 (a customer asks for a change that only agents and admins may make) →
        409 INVALID_TRANSITION (not a workflow change, including the same status and
        anything from closed). If the status changes between reading and saving, the
        update is not applied and 409 STATUS_CONFLICT is returned.


        Moving to resolved sets `resolvedAt`; reopening (resolved → in_progress)
        clears it. `firstResponseAt` is not changed here.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
            example: { status: in_progress }
      responses:
        '200':
          description: Updated ticket, with the next statuses this user may choose
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: '#/components/schemas/TicketDetail' }
              example:
                ticket:
                  id: 6651b2a7c3d4e5f6a7b8c9d1
                  title: Printer in reception not working
                  description: It shows error E-12 since this morning.
                  category: it
                  priority: high
                  status: in_progress
                  createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                  assignee: null
                  firstResponseAt: null
                  resolvedAt: null
                  createdAt: '2026-12-01T09:15:00.000Z'
                  updatedAt: '2026-12-01T09:40:00.000Z'
                  allowedNextStatuses: [waiting, resolved]
        '400':
          description: Missing or unknown status value (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details:
                    - field: status
                      message: 'Status must be one of: open, in_progress, waiting, resolved, closed'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            FORBIDDEN. Only for customers asking for a workflow change reserved for
            agents and admins (for example open → in_progress on their own ticket).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: FORBIDDEN, message: You do not have permission to do this }
        '404':
          description: Ticket not found, not visible to this user, or invalid id (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: NOT_FOUND, message: Ticket not found }
        '409':
          description: >
            INVALID_TRANSITION when the change is not in the workflow (same status,
            from closed, or skipping steps); STATUS_CONFLICT when the status changed
            between reading and saving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidTransition:
                  value:
                    error: { code: INVALID_TRANSITION, message: Cannot change status from Open to Closed }
                conflict:
                  value:
                    error:
                      code: STATUS_CONFLICT
                      message: The status was changed by someone else. Reload the ticket and try again.

  /tickets/{id}/assignee:
    patch:
      tags: [Tickets]
      summary: Assign or claim a ticket (agent, admin)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee: { type: string, nullable: true }
            example: { assignee: '6650c3' }
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{id}/comments:
    get:
      tags: [Comments]
      summary: List comments (internal notes hidden from customers)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: Comments in chronological order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      summary: Add a comment
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
                isInternal: { type: boolean, default: false }
            example: { body: We are replacing the toner today., isInternal: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{id}/attachments:
    post:
      tags: [Attachments]
      summary: Upload a file (png, jpeg, pdf; max 5 MB)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/{id}:
    get:
      tags: [Attachments]
      summary: Download a file (access checked)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      tags: [Users]
      summary: List users (admin)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Created
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already used

  /users/{id}:
    patch:
      tags: [Users]
      summary: Change role or deactivate a user (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
            example: { isActive: false }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit-logs:
    get:
      tags: [Admin]
      summary: List audit entries (admin, read only)
      responses:
        '200':
          description: Audit entries, newest first
        '403': { $ref: '#/components/responses/Forbidden' }

  /metrics/summary:
    get:
      tags: [Admin]
      summary: Open tickets, average resolution time, tickets per agent (admin)
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              example:
                openTickets: 12
                averageResolutionHours: 6.5
                ticketsPerAgent: [ { agent: Lena, count: 5 } ]
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Send `Authorization: Bearer <token>` with the token from /auth/login or
        /auth/register. The server checks the signature (HS256) and expiry, then loads
        the user: the role in the token is not trusted, and deactivated or deleted
        users are rejected. See docs/roles-and-permissions.md.
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: >
        UNAUTHENTICATED. The token is missing, malformed, expired or wrongly signed,
        or the user is deactivated or deleted. All cases return the same body.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: UNAUTHENTICATED, message: Authentication required }
    Forbidden:
      description: FORBIDDEN. Logged in, but the user's role is not allowed to do this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: FORBIDDEN, message: You do not have permission to do this }
    NotFound:
      description: Not found (also used for tickets the user must not see)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Role: { type: string, enum: [customer, agent, admin] }
    Status: { type: string, enum: [open, in_progress, waiting, resolved, closed] }
    Priority: { type: string, enum: [low, normal, high, urgent] }
    Category: { type: string, enum: [it, facility, account, other] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, description: At most 72 bytes (bcrypt limit) }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token:
          type: string
          description: JWT access token with `sub` (user id) and `role`; expires after JWT_EXPIRES_IN (default 1h)
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserRef:
      type: object
      description: A user as shown inside a ticket. Never includes email or passwordHash.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    TicketDetail:
      description: A ticket as returned by GET /tickets/{id} and PATCH /tickets/{id}/status.
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [allowedNextStatuses]
          properties:
            allowedNextStatuses:
              type: array
              items: { $ref: '#/components/schemas/Status' }
              description: >
                Statuses the current user may move this ticket to, in workflow order.
                Empty when the user may not change the status (e.g. closed tickets,
                or a customer's ticket that is not resolved).
    TicketPage:
      type: object
      required: [items, page, limit, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0, description: 0 when there are no tickets }
    TicketCreate:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, description: Trimmed }
        description: { type: string, minLength: 1, maxLength: 5000, description: Trimmed }
        category:
          allOf: [ { $ref: '#/components/schemas/Category' } ]
          default: other
        priority:
          allOf: [ { $ref: '#/components/schemas/Priority' } ]
          default: normal
    Ticket:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        createdBy:
          allOf: [ { $ref: '#/components/schemas/UserRef' } ]
          nullable: true
          description: null if the creator's account was deleted
        assignee:
          allOf: [ { $ref: '#/components/schemas/UserRef' } ]
          nullable: true
        firstResponseAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: string }
