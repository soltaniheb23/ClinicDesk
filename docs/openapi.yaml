openapi: 3.0.3
info:
  title: ClinicDesk API
  version: 1.0.0
  description: >
    Helpdesk API for a clinic. Draft contract for ticket CD-5. Endpoints need a
    bearer token unless they set `security: []`; role rules are in
    docs/roles-and-permissions.md.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Tickets
  - name: Comments
  - name: Attachments
  - name: Users
  - name: Admin

paths:
  /health:
    servers:
      - url: http://localhost:3000
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              example: { status: ok }

  /hello:
    get:
      summary: Staging connectivity check
      security: []
      responses:
        '200':
          description: API greeting for the deployed frontend
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
              example: { message: Hello from ClinicDesk API }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer
      description: >
        Creates a customer account and returns the user with an access token.
        Any `role` sent by the client is ignored; new accounts are always `customer`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example: { name: Mara Jensen, email: mara@example.com, password: a-long-password }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
                token: '<jwt>'
        '400':
          description: Validation error (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details: [ { field: password, message: Password must be at least 8 characters } ]
        '409':
          description: Email already used (EMAIL_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: EMAIL_TAKEN, message: An account with this email already exists }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: >
        Returns an access token. Wrong password, unknown email and deactivated
        accounts all return the same 401 response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: { email: mara@example.com, password: a-long-password }
      responses:
        '200':
          description: Token and user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                token: '<jwt>'
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
        '400':
          description: Missing or malformed fields (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details: [ { field: password, message: Password is required } ]
        '401':
          description: Wrong email or password, or deactivated account (INVALID_CREDENTIALS, always the same message)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: INVALID_CREDENTIALS, message: Invalid email or password }
        '429':
          description: Too many login attempts

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: >
        Returns the user behind the bearer token. The role and active flag are read
        from the database, so a role change or deactivation applies immediately.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets (customers see only their own)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: assignee, in: query, schema: { type: string } }
        - { name: q, in: query, description: Title search, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, default: '-createdAt' } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Paginated tickets
          content:
            application/json:
              example:
                items: [ { id: '6651b2', title: Printer in reception not working, status: open, priority: high } ]
                page: 1
                limit: 20
                total: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tickets]
      summary: Create a ticket (customer, agent, admin)
      description: >
        `createdBy` is the logged-in user. Unknown keys such as `status`, `createdBy`
        and `assignee` are ignored; new tickets are always `open` and unassigned.
        `category` defaults to `other` and `priority` to `normal`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreate' }
            example:
              title: Printer in reception not working
              description: It shows error E-12 since this morning.
              category: it
              priority: high
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: '#/components/schemas/Ticket' }
              example:
                ticket:
                  id: 6651b2a7c3d4e5f6a7b8c9d1
                  title: Printer in reception not working
                  description: It shows error E-12 since this morning.
                  category: it
                  priority: high
                  status: open
                  createdBy: 6650a1f2c3d4e5f6a7b8c9d0
                  assignee: null
                  firstResponseAt: null
                  resolvedAt: null
                  createdAt: '2026-12-01T09:15:00.000Z'
                  updatedAt: '2026-12-01T09:15:00.000Z'
        '400':
          description: Validation error (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details:
                    - { field: title, message: Title must be at most 120 characters }
                    - { field: category, message: Choose a valid category }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Request body larger than 32 KB (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tickets/mine:
    get:
      tags: [Tickets]
      summary: My tickets (any role)
      description: >
        Tickets created by the logged-in user, newest first, at most 50. A minimal read
        for CD-10; the filtered, paginated list is `GET /tickets` (CD-11).
      responses:
        '200':
          description: My tickets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/Ticket' }
              example:
                items:
                  - id: 6651b2a7c3d4e5f6a7b8c9d1
                    title: Printer in reception not working
                    description: It shows error E-12 since this morning.
                    category: it
                    priority: high
                    status: open
                    createdBy: 6650a1f2c3d4e5f6a7b8c9d0
                    assignee: null
                    firstResponseAt: null
                    resolvedAt: null
                    createdAt: '2026-12-01T09:15:00.000Z'
                    updatedAt: '2026-12-01T09:15:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Ticket detail (owner, agent, admin)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: The ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{id}/status:
    patch:
      tags: [Tickets]
      summary: Change status (agent, admin; customer may close own resolved ticket)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
            example: { status: in_progress }
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid status change (INVALID_STATUS_TRANSITION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tickets/{id}/assignee:
    patch:
      tags: [Tickets]
      summary: Assign or claim a ticket (agent, admin)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee: { type: string, nullable: true }
            example: { assignee: '6650c3' }
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{id}/comments:
    get:
      tags: [Comments]
      summary: List comments (internal notes hidden from customers)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: Comments in chronological order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      summary: Add a comment
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
                isInternal: { type: boolean, default: false }
            example: { body: We are replacing the toner today., isInternal: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{id}/attachments:
    post:
      tags: [Attachments]
      summary: Upload a file (png, jpeg, pdf; max 5 MB)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/{id}:
    get:
      tags: [Attachments]
      summary: Download a file (access checked)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      tags: [Users]
      summary: List users (admin)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Created
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already used

  /users/{id}:
    patch:
      tags: [Users]
      summary: Change role or deactivate a user (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
            example: { isActive: false }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit-logs:
    get:
      tags: [Admin]
      summary: List audit entries (admin, read only)
      responses:
        '200':
          description: Audit entries, newest first
        '403': { $ref: '#/components/responses/Forbidden' }

  /metrics/summary:
    get:
      tags: [Admin]
      summary: Open tickets, average resolution time, tickets per agent (admin)
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              example:
                openTickets: 12
                averageResolutionHours: 6.5
                ticketsPerAgent: [ { agent: Lena, count: 5 } ]
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Send `Authorization: Bearer <token>` with the token from /auth/login or
        /auth/register. The server checks the signature (HS256) and expiry, then loads
        the user: the role in the token is not trusted, and deactivated or deleted
        users are rejected. See docs/roles-and-permissions.md.
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: >
        UNAUTHENTICATED. The token is missing, malformed, expired or wrongly signed,
        or the user is deactivated or deleted. All cases return the same body.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: UNAUTHENTICATED, message: Authentication required }
    Forbidden:
      description: FORBIDDEN. Logged in, but the user's role is not allowed to do this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: FORBIDDEN, message: You do not have permission to do this }
    NotFound:
      description: Not found (also used for tickets the user must not see)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Role: { type: string, enum: [customer, agent, admin] }
    Status: { type: string, enum: [open, in_progress, waiting, resolved, closed] }
    Priority: { type: string, enum: [low, normal, high, urgent] }
    Category: { type: string, enum: [it, facility, account, other] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, description: At most 72 bytes (bcrypt limit) }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token:
          type: string
          description: JWT access token with `sub` (user id) and `role`; expires after JWT_EXPIRES_IN (default 1h)
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TicketCreate:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, description: Trimmed }
        description: { type: string, minLength: 1, maxLength: 5000, description: Trimmed }
        category:
          allOf: [ { $ref: '#/components/schemas/Category' } ]
          default: other
        priority:
          allOf: [ { $ref: '#/components/schemas/Priority' } ]
          default: normal
    Ticket:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        createdBy: { type: string }
        assignee: { type: string, nullable: true }
        firstResponseAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: string }
        ticket: { type: string }
        author: { type: string }
        body: { type: string }
        isInternal: { type: boolean }
        createdAt: { type: string, format: date-time }