openapi: 3.0.3
info:
  title: ClinicDesk API
  version: 1.0.0
  description: >
    Helpdesk API for a clinic. Draft contract for ticket CD-5. Endpoints need a
    bearer token unless they set `security: []`; role rules are in
    docs/roles-and-permissions.md. Every /api/v1 route may answer 429 RATE_LIMITED
    (components/responses/RateLimited) once a client exceeds the global limit; login and
    register also have their own, stricter limits. Unknown paths answer a JSON 404.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Tickets
  - name: Comments
  - name: Attachments
  - name: Users
  - name: Admin

paths:
  /health:
    servers:
      - url: http://localhost:3000
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              example: { status: ok }

  /hello:
    get:
      summary: Staging connectivity check
      security: []
      responses:
        '200':
          description: API greeting for the deployed frontend
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
              example: { message: Hello from ClinicDesk API }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer
      description: >
        Creates a customer account and returns the user with an access token.
        Any `role` sent by the client is ignored; new accounts are always `customer`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example: { name: Mara Jensen, email: mara@example.com, password: a-long-password }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
                token: '<jwt>'
        '400':
          description: Validation error (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details: [ { field: password, message: Password must be at least 8 characters } ]
        '409':
          description: Email already used (EMAIL_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: EMAIL_TAKEN, message: An account with this email already exists }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: >
        Returns an access token. Wrong password, unknown email and deactivated
        accounts all return the same 401 response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: { email: mara@example.com, password: a-long-password }
      responses:
        '200':
          description: Token and user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                token: '<jwt>'
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
        '400':
          description: Missing or malformed fields (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details: [ { field: password, message: Password is required } ]
        '401':
          description: Wrong email or password, or deactivated account (INVALID_CREDENTIALS, always the same message)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: INVALID_CREDENTIALS, message: Invalid email or password }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: >
        Returns the user behind the bearer token. The role and active flag are read
        from the database, so a role change or deactivation applies immediately.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: 6650a1f2c3d4e5f6a7b8c9d0
                  name: Mara Jensen
                  email: mara@example.com
                  role: customer
                  isActive: true
                  createdAt: '2026-12-01T09:00:00.000Z'
                  updatedAt: '2026-12-01T09:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets with filters, title search, sorting and pagination
      description: >
        Customers get only the tickets they created; agents and admins get all tickets.
        Filters and search only ever narrow that scope, and `total` counts the same
        filtered set as `items`. All parameters are optional; an unknown parameter, a
        repeated parameter, or an operator form such as `status[$ne]=closed` is a 400.
        Several values of one filter are comma-separated (`status=open,in_progress`).
        Sorting always ends with `_id`, so pages are stable. A page past the end returns
        an empty `items` array. See docs/ticket-list.md.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - name: status
          in: query
          description: One status or a comma-separated list.
          style: form
          explode: false
          schema: { type: array, items: { type: string, enum: [open, in_progress, waiting, resolved, closed] } }
          example: [open, in_progress]
        - name: priority
          in: query
          description: One priority or a comma-separated list.
          style: form
          explode: false
          schema: { type: array, items: { type: string, enum: [low, normal, high, urgent] } }
          example: [high, urgent]
        - name: category
          in: query
          description: One category or a comma-separated list.
          style: form
          explode: false
          schema: { type: array, items: { type: string, enum: [it, facility, account, other] } }
          example: [it]
        - name: assignee
          in: query
          description: >
            Agents and admins only (a customer gets 403). A user id, `me` (the logged-in
            user) or `unassigned`.
          schema:
            oneOf:
              - { type: string, enum: [me, unassigned] }
              - { type: string, pattern: '^[0-9a-fA-F]{24}$' }
          example: me
        - name: q
          in: query
          description: >
            Title search, 1 to 100 characters after trimming. Case-insensitive "contains"
            match; the text is matched literally (regex characters have no meaning).
          schema: { type: string, minLength: 1, maxLength: 100, example: printer }
        - name: sort
          in: query
          description: >
            `priority` sorts by meaning (low < normal < high < urgent) and `status` by
            workflow order (open < in_progress < waiting < resolved < closed); within the
            same value the newest ticket comes first. `_id` is always the last key.
          schema: { type: string, enum: [createdAt, updatedAt, priority, status], default: createdAt }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: One page of tickets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
              examples:
                filtered:
                  summary: GET /tickets?status=open,in_progress&q=printer&sort=priority
                  value:
                    items:
                      - id: 6651b2a7c3d4e5f6a7b8c9d1
                        title: Printer in reception not working
                        description: It shows error E-12 since this morning.
                        category: it
                        priority: high
                        status: open
                        createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                        assignee: null
                        firstResponseAt: null
                        resolvedAt: null
                        createdAt: '2026-12-01T09:15:00.000Z'
                        updatedAt: '2026-12-01T09:15:00.000Z'
                    page: 1
                    limit: 10
                    total: 1
                    totalPages: 1
                noMatch:
                  summary: Nothing matches the filters
                  value: { items: [], page: 1, limit: 10, total: 0, totalPages: 0 }
        '400':
          description: >
            Invalid page, limit, filter value, search, sort or order; an unknown or repeated
            parameter; or an operator form such as `status[$ne]` (VALIDATION_ERROR). The
            `field` is the parameter name as sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badValue:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid
                      details:
                        - field: status
                          message: 'Status must be one or more of: open, in_progress, waiting, resolved, closed (comma-separated)'
                        - field: sort
                          message: 'Sort must be one of: createdAt, updatedAt, priority, status'
                operator:
                  summary: GET /tickets?status[$ne]=closed
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid
                      details: [ { field: 'status[$ne]', message: Unknown query parameter } ]
        '403':
          description: A customer sent `assignee` (FORBIDDEN). Checked after the 400 checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: FORBIDDEN, message: You do not have permission to do this }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tickets]
      summary: Create a ticket (customer, agent, admin)
      description: >
        `createdBy` is the logged-in user. Unknown keys such as `status`, `createdBy`
        and `assignee` are ignored; new tickets are always `open` and unassigned.
        `category` defaults to `other` and `priority` to `normal`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreate' }
            example:
              title: Printer in reception not working
              description: It shows error E-12 since this morning.
              category: it
              priority: high
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: '#/components/schemas/Ticket' }
              example:
                ticket:
                  id: 6651b2a7c3d4e5f6a7b8c9d1
                  title: Printer in reception not working
                  description: It shows error E-12 since this morning.
                  category: it
                  priority: high
                  status: open
                  createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                  assignee: null
                  firstResponseAt: null
                  resolvedAt: null
                  createdAt: '2026-12-01T09:15:00.000Z'
                  updatedAt: '2026-12-01T09:15:00.000Z'
        '400':
          description: Validation error (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details:
                    - { field: title, message: Title must be at most 120 characters }
                    - { field: category, message: Choose a valid category }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Request body larger than 32 KB (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Ticket detail (owner, agent, admin)
      description: >
        An invalid id, an unknown ticket and another customer's ticket all return the
        same 404, so the response never reveals whether a ticket exists.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: The ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: '#/components/schemas/TicketDetail' }
              example:
                ticket:
                  id: 6651b2a7c3d4e5f6a7b8c9d1
                  title: Printer in reception not working
                  description: It shows error E-12 since this morning.
                  category: it
                  priority: high
                  status: in_progress
                  createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                  assignee: { id: 6650c3a1b2c3d4e5f6a7b8c9, name: Lena Berg }
                  firstResponseAt: '2026-12-01T09:40:00.000Z'
                  resolvedAt: null
                  createdAt: '2026-12-01T09:15:00.000Z'
                  updatedAt: '2026-12-01T09:40:00.000Z'
                  allowedNextStatuses: [waiting, resolved]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Ticket not found, not visible to this user, or invalid id (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: NOT_FOUND, message: Ticket not found }

  /tickets/{id}/status:
    patch:
      tags: [Tickets]
      summary: Change status (agent, admin; customer may close own resolved ticket)
      description: >
        Follows docs/status-workflow.md. Allowed: open → in_progress;
        in_progress → waiting, resolved; waiting → in_progress, resolved;
        resolved → closed, in_progress (reopen); closed is final. Agents and admins may
        make any allowed change on any ticket; a customer may only change their own
        resolved ticket to closed.


        Checks run in this order: 404 (invalid id, unknown ticket, or another
        customer's ticket; same body as GET /tickets/{id}) → 400 (invalid body) →
        403 (a customer asks for a change that only agents and admins may make) →
        409 INVALID_TRANSITION (not a workflow change, including the same status and
        anything from closed). If the status changes between reading and saving, the
        update is not applied and 409 STATUS_CONFLICT is returned.


        Moving to resolved sets `resolvedAt`; reopening (resolved → in_progress)
        clears it. `firstResponseAt` is not changed here.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
            example: { status: in_progress }
      responses:
        '200':
          description: Updated ticket, with the next statuses this user may choose
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: '#/components/schemas/TicketDetail' }
              example:
                ticket:
                  id: 6651b2a7c3d4e5f6a7b8c9d1
                  title: Printer in reception not working
                  description: It shows error E-12 since this morning.
                  category: it
                  priority: high
                  status: in_progress
                  createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                  assignee: null
                  firstResponseAt: null
                  resolvedAt: null
                  createdAt: '2026-12-01T09:15:00.000Z'
                  updatedAt: '2026-12-01T09:40:00.000Z'
                  allowedNextStatuses: [waiting, resolved]
        '400':
          description: Missing or unknown status value (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details:
                    - field: status
                      message: 'Status must be one of: open, in_progress, waiting, resolved, closed'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            FORBIDDEN. Only for customers asking for a workflow change reserved for
            agents and admins (for example open → in_progress on their own ticket).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: FORBIDDEN, message: You do not have permission to do this }
        '404':
          description: Ticket not found, not visible to this user, or invalid id (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: NOT_FOUND, message: Ticket not found }
        '409':
          description: >
            INVALID_TRANSITION when the change is not in the workflow (same status,
            from closed, or skipping steps); STATUS_CONFLICT when the status changed
            between reading and saving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidTransition:
                  value:
                    error: { code: INVALID_TRANSITION, message: Cannot change status from Open to Closed }
                conflict:
                  value:
                    error:
                      code: STATUS_CONFLICT
                      message: The status was changed by someone else. Reload the ticket and try again.

  /tickets/{id}/assignee:
    patch:
      tags: [Tickets]
      summary: Assign, claim or release a ticket (agent, admin)
      description: >
        See docs/assignment.md. Agents may set `assignee` to their own id (claim, also
        from another agent) or to `null` when the ticket is assigned to them (release).
        Admins may set any active agent or admin, or `null`.


        Checks run in this order: 404 (invalid id, unknown ticket, or another
        customer's ticket; same body as GET /tickets/{id}) → 403 (customer) →
        400 (invalid body) → 400 (assignee does not exist, is inactive, or is a
        customer) → 403 (an agent assigns someone else or releases a ticket that is
        not theirs) → 409 TICKET_CLOSED. If the assignee changes, or the ticket is
        closed, between reading and saving, the update is not applied and
        409 ASSIGNEE_CONFLICT is returned. The status is not changed.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee:
                  type: string
                  nullable: true
                  description: Id of an active agent or admin, or null to unassign
            examples:
              assign:
                value: { assignee: 6650c3a1b2c3d4e5f6a7b8c9 }
              unassign:
                value: { assignee: null }
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: '#/components/schemas/TicketDetail' }
              example:
                ticket:
                  id: 6651b2a7c3d4e5f6a7b8c9d1
                  title: Printer in reception not working
                  description: It shows error E-12 since this morning.
                  category: it
                  priority: high
                  status: open
                  createdBy: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen }
                  assignee: { id: 6650c3a1b2c3d4e5f6a7b8c9, name: Lena Berg }
                  firstResponseAt: null
                  resolvedAt: null
                  createdAt: '2026-12-01T09:15:00.000Z'
                  updatedAt: '2026-12-01T09:20:00.000Z'
                  allowedNextStatuses: [in_progress]
        '400':
          description: >
            VALIDATION_ERROR. `assignee` is missing or not a user id or null, or the
            user does not exist, is inactive, or is not an agent or admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidBody:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid
                      details: [ { field: assignee, message: Assignee must be a user id or null } ]
                notAnAgent:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid
                      details:
                        - { field: assignee, message: Assignee must be an active agent or admin }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            FORBIDDEN. The user is a customer, or an agent tries to assign someone else
            or to release a ticket that is not assigned to them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: FORBIDDEN, message: You do not have permission to do this }
        '404':
          description: Ticket not found, not visible to this user, or invalid id (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: NOT_FOUND, message: Ticket not found }
        '409':
          description: >
            TICKET_CLOSED when the ticket is closed; ASSIGNEE_CONFLICT when the assignee
            changed (or the ticket was closed) between reading and saving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                closed:
                  value:
                    error: { code: TICKET_CLOSED, message: A closed ticket cannot be reassigned }
                conflict:
                  value:
                    error:
                      code: ASSIGNEE_CONFLICT
                      message: The ticket was changed by someone else. Reload the ticket and try again.

  /tickets/{id}/comments:
    get:
      tags: [Comments]
      summary: List comments, oldest first (internal notes hidden from customers)
      description: >
        Same visibility rule as GET /tickets/{id}: an invalid id, an unknown ticket and
        another customer's ticket all return the same 404. Customers never receive
        internal notes (they are filtered out in the database query). Authors are
        `{ id, name, role }` only. See docs/comments.md.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: Comments in chronological order (oldest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
              example:
                items:
                  - id: 6652a1b2c3d4e5f6a7b8c9e1
                    ticket: 6651b2a7c3d4e5f6a7b8c9d1
                    author: { id: 6650a1f2c3d4e5f6a7b8c9d0, name: Mara Jensen, role: customer }
                    body: It is still broken.
                    internal: false
                    createdAt: '2026-12-01T09:20:00.000Z'
                  - id: 6652a1b2c3d4e5f6a7b8c9e2
                    ticket: 6651b2a7c3d4e5f6a7b8c9d1
                    author: { id: 6650c3a1b2c3d4e5f6a7b8c9, name: Lena Berg, role: agent }
                    body: We are replacing the toner today.
                    internal: false
                    createdAt: '2026-12-01T09:40:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Ticket not found, not visible to this user, or invalid id (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: NOT_FOUND, message: Ticket not found }
    post:
      tags: [Comments]
      summary: Add a comment (customer on own ticket, agent, admin)
      description: >
        `author`, `ticket` and `createdAt` are set by the server; unknown keys are
        ignored. Only agents and admins may send `internal: true`.


        Checks run in this order: 404 (invalid id, unknown ticket, or another
        customer's ticket) → 400 (invalid body) → 403 (a customer sends
        `internal: true`) → 409 TICKET_CLOSED.


        The first non-internal comment by an agent or admin sets the ticket's
        `firstResponseAt` (only while it is null). Internal notes and customer comments
        never set it.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000, description: Trimmed before validation }
                internal: { type: boolean, default: false, description: Agents and admins only }
            example: { body: We are replacing the toner today., internal: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment: { $ref: '#/components/schemas/Comment' }
              example:
                comment:
                  id: 6652a1b2c3d4e5f6a7b8c9e2
                  ticket: 6651b2a7c3d4e5f6a7b8c9d1
                  author: { id: 6650c3a1b2c3d4e5f6a7b8c9, name: Lena Berg, role: agent }
                  body: We are replacing the toner today.
                  internal: false
                  createdAt: '2026-12-01T09:40:00.000Z'
        '400':
          description: Invalid body (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields are invalid
                  details: [ { field: body, message: Comment must be at most 2000 characters } ]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "FORBIDDEN. A customer sent `internal: true`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: FORBIDDEN, message: You do not have permission to do this }
        '404':
          description: Ticket not found, not visible to this user, or invalid id (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: NOT_FOUND, message: Ticket not found }
        '409':
          description: TICKET_CLOSED. Closed tickets accept no comments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: TICKET_CLOSED, message: A closed ticket does not accept comments }

  /tickets/{id}/attachments:
    post:
      tags: [Attachments]
      summary: Upload a file (png, jpeg, pdf; max 5 MB)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/{id}:
    get:
      tags: [Attachments]
      summary: Download a file (access checked)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file
        '404': { $ref: '#/components/responses/NotFound' }

  /users/agents:
    get:
      tags: [Users]
      summary: Active agents and admins (agent, admin)
      description: >
        For the admin's assignee select. Returns only `id` and `name` (never email or
        role), sorted by name. Inactive users and customers are left out.
      responses:
        '200':
          description: Active agents and admins
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserRef' }
              example:
                items:
                  - { id: 6650d4b2c3d4e5f6a7b8c9d2, name: Anton Weber }
                  - { id: 6650c3a1b2c3d4e5f6a7b8c9, name: Lena Berg }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users:
    get:
      tags: [Users]
      summary: List users with filters, search and pagination (admin)
      description: >
        Admin only. Sorted by name (case-insensitive), then `_id`, so pages are stable.
        All parameters are optional; an unknown parameter, a repeated parameter, or an
        operator form such as `role[$ne]=admin` is a 400. A page past the end returns an
        empty `items` array. Never returns `passwordHash`. Order of checks: 401 -> 403 ->
        400. See docs/user-management.md.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - name: isActive
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: q
          in: query
          description: >
            Name or email search, 1 to 100 characters after trimming. Case-insensitive
            "contains" match; the text is matched literally (regex characters have no
            meaning).
          schema: { type: string, minLength: 1, maxLength: 100, example: berg }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
              example:
                items:
                  - id: 6650c3a1b2c3d4e5f6a7b8c9
                    name: Lena Berg
                    email: lena@example.com
                    role: agent
                    isActive: true
                    createdAt: '2026-11-02T09:00:00.000Z'
                page: 1
                limit: 10
                total: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user with any role (admin)
      description: >
        Admin only. Same name, email and password rules as /auth/register, plus a
        required role. The account is active at once; `isActive` and other unknown
        fields are ignored. No token is returned and nothing is emailed: the admin gives
        the temporary password to the person directly. Order of checks: 401 -> 403 ->
        400 -> 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, description: At most 72 bytes (bcrypt limit) }
                role: { $ref: '#/components/schemas/Role' }
            example:
              name: Lena Berg
              email: lena@example.com
              password: a-temporary-password
              role: agent
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: EMAIL_TAKEN. An account with this email already exists (any letter case).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: EMAIL_TAKEN, message: An account with this email already exists }

  /users/{id}:
    patch:
      tags: [Users]
      summary: Change a user's role and/or deactivate or reactivate them (admin)
      description: >
        Admin only. Send `role`, `isActive` or both. The change applies to the user's
        existing tokens on their next request (the role and active state are read from
        the database every time); a deactivated user gets 401 at once and cannot log in.
        Order of checks: 401 -> 403 -> 400 -> 404 -> 409. See docs/user-management.md.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
            examples:
              deactivate: { value: { isActive: false } }
              promote: { value: { role: agent } }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND. The id is not a valid id, or no such user exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: NOT_FOUND, message: User not found }
        '409':
          description: >
            A safeguard refused the change. `CANNOT_CHANGE_SELF`: admins cannot change
            their own role or active state. `LAST_ADMIN`: the last active admin can never
            be demoted or deactivated. `USER_CONFLICT`: the user's role or active state
            changed while the request ran; reload and try again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                self:
                  value:
                    error:
                      code: CANNOT_CHANGE_SELF
                      message: You cannot change your own role or deactivate your own account
                lastAdmin:
                  value:
                    error:
                      code: LAST_ADMIN
                      message: The last active admin cannot be demoted or deactivated
                conflict:
                  value:
                    error:
                      code: USER_CONFLICT
                      message: The user was changed by someone else. Reload the list and try again.

  /audit-logs:
    get:
      tags: [Admin]
      summary: List audit entries, newest first (admin, read only)
      description: >
        Admin only. Who did what and when: logins (success and failed), ticket status and
        assignment changes, and users created or changed by an admin. Sorted by
        `createdAt` then `_id`, newest first. There is no route to create, change or delete
        entries. All parameters are optional; an unknown parameter, a repeated parameter
        or an operator form such as `action[$ne]=auth.login` is a 400. Order of checks:
        401 -> 403 -> 400. See docs/audit-log.md.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: action, in: query, schema: { $ref: '#/components/schemas/AuditAction' } }
        - name: actor
          in: query
          description: Only entries by this user id.
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
        - { name: entityType, in: query, schema: { type: string, enum: [user, ticket] } }
        - name: from
          in: query
          description: >
            Inclusive start. An ISO date-time with a time zone (`2026-11-20T00:00:00Z`,
            `2026-11-20T01:00:00+01:00`) or a plain date (read as 00:00 UTC).
          schema: { type: string, example: '2026-11-20T00:00:00.000Z' }
        - name: to
          in: query
          description: >
            Inclusive end, same formats as `from`; a plain date covers that whole UTC day.
            Must not be before `from`.
          schema: { type: string, example: '2026-11-25T23:59:59.999Z' }
      responses:
        '200':
          description: One page of audit entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
              example:
                items:
                  - id: 6651c9e0c3d4e5f6a7b8c9e5
                    actor: null
                    action: auth.login_failed
                    entityType: user
                    entityId: null
                    entityLabel: null
                    metadata: { email: mara@example.com }
                    createdAt: '2026-11-25T10:05:00.000Z'
                  - id: 6651c9e0c3d4e5f6a7b8c9e4
                    actor: { id: 6650d4b2c3d4e5f6a7b8c9d2, name: Anton Weber }
                    action: ticket.assignee_changed
                    entityType: ticket
                    entityId: 6651b2a7c3d4e5f6a7b8c9d1
                    entityLabel: Printer in reception not working
                    metadata:
                      from: null
                      to: { id: 6650c3a1b2c3d4e5f6a7b8c9, name: Lena Berg }
                    createdAt: '2026-11-25T10:04:00.000Z'
                page: 1
                limit: 10
                total: 2
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /metrics/summary:
    get:
      tags: [Admin]
      summary: Open tickets, average resolution time, tickets per agent (admin)
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              example:
                openTickets: 12
                averageResolutionHours: 6.5
                ticketsPerAgent: [ { agent: Lena, count: 5 } ]
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Send `Authorization: Bearer <token>` with the token from /auth/login or
        /auth/register. The server checks the signature (HS256) and expiry, then loads
        the user: the role in the token is not trusted, and deactivated or deleted
        users are rejected. See docs/roles-and-permissions.md.
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    RateLimited:
      description: >
        RATE_LIMITED. Too many requests from this client IP. Login counts failed attempts
        only (10 per 15 minutes by default), register 5 per hour, and every /api/v1 route
        together 300 per 15 minutes. All limits can be changed with RATE_LIMIT_* (see
        docs/security-review.md). The request is not processed, so a limited login writes
        no audit entry.
      headers:
        Retry-After:
          description: Seconds until the client may try again.
          schema: { type: integer, example: 900 }
        RateLimit:
          description: Remaining requests and reset time (IETF draft 7).
          schema: { type: string, example: 'limit=10, remaining=0, reset=900' }
        RateLimit-Policy:
          schema: { type: string, example: '10;w=900' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: RATE_LIMITED, message: Too many login attempts. Try again in 15 minutes. }
    Unauthorized:
      description: >
        UNAUTHENTICATED. The token is missing, malformed, expired or wrongly signed,
        or the user is deactivated or deleted. All cases return the same body.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: UNAUTHENTICATED, message: Authentication required }
    Forbidden:
      description: FORBIDDEN. Logged in, but the user's role is not allowed to do this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: FORBIDDEN, message: You do not have permission to do this }
    NotFound:
      description: Not found (also used for tickets the user must not see)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Role: { type: string, enum: [customer, agent, admin] }
    Status: { type: string, enum: [open, in_progress, waiting, resolved, closed] }
    Priority: { type: string, enum: [low, normal, high, urgent] }
    Category: { type: string, enum: [it, facility, account, other] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, description: At most 72 bytes (bcrypt limit) }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token:
          type: string
          description: JWT access token with `sub` (user id) and `role`; expires after JWT_EXPIRES_IN (default 1h)
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminUser:
      type: object
      description: A user as returned by the admin /users routes. Never includes passwordHash.
      required: [id, name, email, role, isActive, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items, page, limit, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    AuditAction:
      type: string
      enum:
        - auth.login
        - auth.login_failed
        - ticket.status_changed
        - ticket.assignee_changed
        - user.created
        - user.role_changed
        - user.active_changed
    AuditEntry:
      type: object
      description: >
        One audit entry. `metadata` depends on the action (docs/audit-log.md) and never
        holds passwords, hashes, tokens or request bodies.
      required: [id, actor, action, entityType, entityId, entityLabel, metadata, createdAt]
      properties:
        id: { type: string }
        actor:
          description: The user who acted (id and name only); null for a failed login or a deleted user.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
        action: { $ref: '#/components/schemas/AuditAction' }
        entityType: { type: string, enum: [user, ticket] }
        entityId: { type: string, nullable: true, description: Null for a failed login. }
        entityLabel:
          type: string
          nullable: true
          description: The user's current name or the ticket's title; null if it no longer exists.
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditLogPage:
      type: object
      required: [items, page, limit, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    UserRef:
      type: object
      description: A user as shown inside a ticket. Never includes email or passwordHash.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    TicketDetail:
      description: >
        A ticket as returned by GET /tickets/{id}, PATCH /tickets/{id}/status and
        PATCH /tickets/{id}/assignee.
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [allowedNextStatuses]
          properties:
            allowedNextStatuses:
              type: array
              items: { $ref: '#/components/schemas/Status' }
              description: >
                Statuses the current user may move this ticket to, in workflow order.
                Empty when the user may not change the status (e.g. closed tickets,
                or a customer's ticket that is not resolved).
    TicketPage:
      type: object
      required: [items, page, limit, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0, description: 0 when there are no tickets }
    TicketCreate:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, description: Trimmed }
        description: { type: string, minLength: 1, maxLength: 5000, description: Trimmed }
        category:
          allOf: [ { $ref: '#/components/schemas/Category' } ]
          default: other
        priority:
          allOf: [ { $ref: '#/components/schemas/Priority' } ]
          default: normal
    Ticket:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        createdBy:
          allOf: [ { $ref: '#/components/schemas/UserRef' } ]
          nullable: true
          description: null if the creator's account was deleted
        assignee:
          allOf: [ { $ref: '#/components/schemas/UserRef' } ]
          nullable: true
        firstResponseAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CommentAuthor:
      type: object
      description: A comment author. Never includes email or passwordHash.
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Comment:
      type: object
      required: [id, ticket, author, body, internal, createdAt]
      properties:
        id: { type: string }
        ticket: { type: string, description: Ticket id }
        author:
          description: null if the author's account was deleted
          allOf: [ { $ref: '#/components/schemas/CommentAuthor' } ]
          nullable: true
        body: { type: string, maxLength: 2000 }
        internal: { type: boolean, description: Internal notes are never sent to customers }
        createdAt: { type: string, format: date-time }